[tool.poetry]
name = "mlb-db-analysis"
version = "0.1.0"
description = "Virtual environment to be used for creation and managment of local postgres database consisting of MLB data sourced from retrosheet and the MLB API. Env will also be used for any analysis through jupyter notebooks."
authors = ["David Lenci"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0.0"
seaborn = "^0.13.2"
requests = "^2.32.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
